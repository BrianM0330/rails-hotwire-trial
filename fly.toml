# fly.toml app configuration file generated for rails-hotwire-trial-earnest-current-5647 on 2026-05-13T23:10:40-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rails-hotwire-trial-earnest-current-5647'
primary_region = 'sjc'
console_command = '/rails/bin/rails console'

[build]

[env]
  HTTP_PORT = '8080'

[[mounts]]
source = 'rails_storage'
destination = '/rails/storage'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
interval = '10s'
timeout = '2s'
grace_period = '5s'
method = 'GET'
path = '/up'
protocol = 'http'
tls_skip_verify = false

[http_service.checks.headers]
X-Forwarded-Proto = 'https'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024
